name: Fresher job scrape

on:
  # 11:00 and 16:00 IST.
  # schedule:
  #   - cron: "0 11 * * *"
  #     timezone: "Asia/Kolkata"
  #   - cron: "0 16 * * *"
  #     timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Hours of job history to fetch (default: 20)"
        required: true
        type: choice
        default: "20"
        options:
          - "20"
          - "48"

permissions:
  contents: write

concurrency:
  group: fresher-job-scraper
  # A new scheduled run must not be blocked by a stale runner status.
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_FILE: credentials.json
      GOOGLE_JOBS_WORKSHEET: Sheet1
      # LLM API Keys passed from GitHub Secrets
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: "nvidia/nemotron-3-ultra-550b-a55b:free"

    steps:
      - name: Verify Google Sheets secrets are configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_SPREADSHEET_ID" || { echo "Missing repository secret: GOOGLE_SPREADSHEET_ID"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "Missing repository secret: GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }

      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create Google service-account key
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          key = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]
          parsed = json.loads(key)
          if parsed.get("type") != "service_account":
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON must be a service-account JSON key")
          Path("credentials.json").write_text(key, encoding="utf-8")
          PY

      # - name: Run scheduled 20-hour scrape and sync
      #   if: github.event_name == 'schedule'
      #   run: python -u main.py --hours 20

      - name: Run requested initial/manual scrape and sync
        if: github.event_name == 'workflow_dispatch'
        run: python -u main.py --hours "${{ inputs.lookback_hours }}"

      # This public repository's schedule can be disabled after 60 days without
      # repository activity. Record each successful run to keep it active.
      - name: Record successful run
        if: success()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-successful-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-successful-run.txt
          git commit -m "Record successful scraper run"
          git pull --rebase origin main
          git push
